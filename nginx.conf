server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router-dom owns client-side routes like /gallery or
    # /create, which don't exist as files — always hand back index.html and
    # let the router take it from there. Without this, a hard refresh on any
    # non-root route 404s.
    location / {
        try_files $uri /index.html;
    }

    # Vite fingerprints filenames under /assets (content hash in the name), so
    # these are safe to cache forever — a change ships under a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
